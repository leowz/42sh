name: Build WASM bundle

# Building the bundle takes 15-20 minutes (compiles QEMU + emscripten),
# so we don't run it on every push. Triggers:
#   • workflow_dispatch — manual run from the Actions tab
#   • push to a tag matching wasm-*  → also publishes a Release

on:
  workflow_dispatch:
  push:
    tags:
      - "wasm-*"

jobs:
  build:
    name: make wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Free up the runner's ~14GB disk before pulling the heavy
      # emscripten + golang + gcc images that c2w needs.
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libncurses-dev

      - name: Build wasm bundle (Docker image + c2w + dist)
        run: make wasm

      - name: List built artifacts
        run: |
          ls -lh wasm/dist/
          du -sh wasm/dist/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 42sh-wasm-dist
          path: wasm/dist/
          retention-days: 30
          if-no-files-found: error

      # If the workflow was triggered by a wasm-* tag, also publish the
      # bundle as a Release so users can `curl` the .data / .wasm files.
      - name: Publish release for wasm-* tag
        if: startsWith(github.ref, 'refs/tags/wasm-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wasm/dist/qemu-system-x86_64.data
            wasm/dist/qemu-system-x86_64.wasm
            wasm/dist/out.js
            wasm/dist/load.js
            wasm/dist/arg-module.js
          generate_release_notes: true
          fail_on_unmatched_files: true

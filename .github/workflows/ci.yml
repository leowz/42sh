name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ──────────────────────────────────────────
  # Run the test suite on every push / PR
  # ──────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreadline-dev \
            libncurses-dev \
            valgrind

      - name: Run unit tests
        run: make test

      - name: Run integration tests
        run: make integration

  # ──────────────────────────────────────────
  # Generate HTML docs and push to `docs` branch
  # Only runs on main after tests pass
  # ──────────────────────────────────────────
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreadline-dev \
            libncurses-dev \
            doxygen \
            man2html

      - name: Install Sphinx and documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Generate HTML documentation
        run: make html

      - name: Stage site (docs + viz + wasm shim + SW at root)
        run: |
          mkdir -p _site
          cp -r docs/_build/html _site/docs
          cp -r viz _site/viz
          # Small c2w JS files (out.js, load.js, arg-module.js) live in git
          # and need to be served alongside viz/. The two heavy binary blobs
          # (qemu-system-x86_64.{data,wasm}) are NOT in git — live.html
          # fetches them through a Cloudflare Worker proxy.
          if [ -d wasm/dist ]; then
            mkdir -p _site/wasm/dist
            cp -r wasm/dist/* _site/wasm/dist/ || true
          fi
          # COI service worker MUST be at the site root so its scope covers
          # both /viz/* (the page) and /wasm/dist/* (where emscripten
          # spawns Web Workers from out.js).
          cp coi-serviceworker.js _site/coi-serviceworker.js

      - name: Deploy to the `docs` branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: docs
          enable_jekyll: false
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: auto-generated from ${{ github.sha }}"

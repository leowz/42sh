name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ──────────────────────────────────────────
  # Run the test suite on every push / PR
  # ──────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreadline-dev \
            libncurses-dev

      - name: Run tests
        run: make test

  # ──────────────────────────────────────────
  # Generate HTML docs and push to `docs` branch
  # Only runs on main after tests pass
  # ──────────────────────────────────────────
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libreadline-dev \
            libncurses-dev \
            doxygen \
            man2html

      - name: Generate HTML documentation
        run: make html

      - name: Bundle viz into docs
        run: cp -r viz docs/viz

      - name: Deploy docs/ to the `docs` branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: docs
          enable_jekyll: false
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: auto-generated from ${{ github.sha }}"
